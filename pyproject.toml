[project]
name = "inspect-boltons"
version = "0.1.0"
description = "Reusable tools and utilities for Inspect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.5.0",
    "inspect-ai>=0.3.241",
    "tabulate>=0.10.0",
]

[project.scripts]
ibolt = "inspect_boltons.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspect_boltons"]

[tool.ruff.lint]
select = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
