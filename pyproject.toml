[project]
name = "inspect-boltons"
version = "0.1.0"
description = "Reusable tools and utilities for Inspect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.266",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspect_boltons"]

[tool.ruff.lint]
select = []
